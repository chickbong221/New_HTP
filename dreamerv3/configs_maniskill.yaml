# ManiSkill config overlay.
#
# This file is NOT read by dreamerv3.main or dreamerv3.main_htp. It is
# deep-merged into configs.yaml by dreamerv3.main_maniskill only, so that the
# Atari runs keep a byte-identical config tree -- and therefore an identical
# paper-artifact resolved_config_hash -- to before the ManiSkill merge. The
# hash is computed from `args`, which embeds `config.env`, so adding
# `env.maniskill` to configs.yaml itself would invalidate every published
# checkpoint manifest.
#
# Values follow dreamerv3-maniskill-hab/dreamerv3/configs.yaml.

defaults:

  env:
    maniskill:
      use_seed: true
      num_envs: 32
      obs_mode: state
      sim_backend: gpu
      image_size: 64
      control_mode: pd_ee_delta_pos
      num_frames: 1
      # false keeps obj_pose / goal_pos / tcp_to_obj_pos / obj_to_goal_pos in
      # the state observation. ReLDreamer sets true (stripping them, as the
      # mshab baselines do); this is a deliberate deviation, and it changes
      # what the agent sees and the state dimensionality.
      nonprivileged_obs: false
      # 0 = keep the task's registered horizon (PickCube-v1 is 50, which is
      # already longer than the 33-frame evaluation protocol needs).
      max_episode_steps: 0
      eval_max_episode_steps: 0
      reward_mode: normalized_dense  # 'sparse' | 'dense' | 'normalized_dense'
      # Forwarded to gym.make through the wrapper's **kwargs. SAPIEN's default
      # shader allocates a full set of per-camera render targets (normals,
      # albedo, position, segmentation); 'minimal' keeps only what the
      # observation needs, and without it camera-group creation can exhaust
      # GPU memory at this num_envs and image_size. ReLDreamer passes this
      # only on its MSHAB branch; setting it here is a deliberate deviation.
      shader_dir: minimal

  run:
    eval_freq: 50000
    eval_video_freq: 0
    eval_reconfiguration_frequency: 1

  # W&B settings as config keys. configs.yaml has no such keys -- upstream
  # make_logger reads WANDB_* from the environment -- and elements.Config
  # rejects a preset that sets a key the defaults never declared, so they are
  # declared here. main_maniskill.make_logger feeds them to the environment
  # with setdefault, which keeps an already-exported WANDB_* variable
  # authoritative for sweeps and lets the config fill in the rest.
  logger:
    wandb_project: ''
    wandb_entity: ''
    wandb_group: ''
    # Empty resolves to dreamerv3-<task>-<obs_mode>-<seed> at startup rather
    # than a literal that would mislabel every run but the one it was copied
    # from. Override with --logger.wandb_name.
    wandb_name: ''

# ──────────────────────────────────────────────────────────────────────────────
#  maniskill_rgb — mirrors dreamerv3-maniskill-hab's preset of the same name.
#  Run with:  python -m dreamerv3.main_maniskill --configs maniskill_rgb \
#               --task maniskill_PickCube-v1 --logdir ...
#  Compose the HTP variant on top, e.g.
#             --configs maniskill_rgb corewm_full
# ──────────────────────────────────────────────────────────────────────────────

maniskill_rgb:
  task: maniskill_PickCube-v1
  # size50m, inlined: YAML anchors do not cross files, so `<<: *size50m` from
  # configs.yaml cannot be referenced from this overlay. ReLDreamer uses
  # size100m here; this is a deliberate deviation.
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512
  run:
    envs: 1
    eval_envs: 4
    eval_eps: 1
    eval_freq: 50000
    eval_video_freq: 1000000
    train_ratio: 64.0   # lower than state: CNN encoder adds cost per update
    steps: 2e6
    log_every: 1500
    # ReLDreamer's train loop has no periodic save at all and only calls
    # cp.save() when the run ends, so its save_every: 50000 is dead config.
    # 0 reproduces that behaviour here: one checkpoint, at the end.
    save_every: 0
    report_every: 7200
    exact_env_action_budget: false  # rejected by train_maniskill; see its docstring
  batch_size: 8         # smaller: [8, 64, 128, 128, 3] RGB tensors are large
  batch_length: 64
  replay_context: 1
  replay:
    size: 600000        # TD-MPC2 rgb: buffer_size=100_000 (pixels expensive)
    online: true
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
  jax:
    prealloc: false     # critical: ManiSkill and JAX share GPU
  logger:
    outputs: [wandb]
    wandb_project: maniskill
    wandb_entity: letuanhf-hanoi-university-of-science-and-technology
    wandb_group: na
    wandb_name: ''      # resolves to dreamerv3-<task>-<obs_mode>-<seed>
  env:
    maniskill:
      use_seed: true
      num_envs: 126
      obs_mode: rgb
      sim_backend: gpu
      image_size: 128
      control_mode: pd_ee_delta_pos   # 3-dim xyz delta + gripper = 4-dim action
      num_frames: 1          # no frame stacking → 3 channels input to CNN

# ──────────────────────────────────────────────────────────────────────────────
#  maniskill_rgb_eval_ready — NOW BYTE-IDENTICAL TO maniskill_rgb.
#
#  It existed because maniskill_rgb used to set save_every -1 (never
#  checkpoint) and image_size 64. Both presets now match ReLDreamer: one
#  checkpoint at the end of the run, image_size 128. Prefer maniskill_rgb;
#  this name is kept only so existing commands keep working, and it is
#  spelled out in full rather than aliased because presets do not inherit
#  from one another -- they are applied in the order given on the command
#  line, so a partial preset would silently fall back to the obs_mode 'state'
#  default and produce a checkpoint with no image decoder.
#
#  obs_mode rgb and num_frames 1 are required, not cosmetic: the evaluation
#  decodes an `image` key and the figures tile 3-channel views.
#
#  No horizon override is needed. The protocol needs
#  corewm_eval.config.MIN_CLIP_LENGTH = 16 warm-up + 16 imagined + 1 initial
#  = 33 frames in a single episode, which fits inside the 50 steps that
#  PickCube-v1, StackCube-v1 and PushCube-v1 register natively.
#  PullCubeTool-v1 keeps its native 100. The max_episode_steps /
#  eval_max_episode_steps knobs stay available as an escape hatch for a task
#  that registers fewer than 33 steps.
# ──────────────────────────────────────────────────────────────────────────────

maniskill_rgb_eval_ready:
  task: maniskill_PickCube-v1
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512
  run:
    envs: 1
    eval_envs: 4
    eval_eps: 1
    eval_freq: 50000
    eval_video_freq: 1000000
    train_ratio: 64.0
    steps: 2e6
    log_every: 1500
    # Wall-clock seconds, not steps: 0 means no periodic saves and exactly one
    # final save when the run finishes, matching ReLDreamer. Set a positive
    # value to also snapshot every N seconds.
    save_every: 0
    report_every: 7200
    exact_env_action_budget: false
  batch_size: 8
  batch_length: 64
  replay_context: 1
  replay:
    size: 600000
    online: true
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
  jax:
    prealloc: false
  logger:
    outputs: [wandb]
    wandb_project: maniskill
    wandb_entity: letuanhf-hanoi-university-of-science-and-technology
    wandb_group: na
    wandb_name: ''
  env:
    maniskill:
      use_seed: true
      num_envs: 126
      obs_mode: rgb
      sim_backend: gpu
      image_size: 128
      control_mode: pd_ee_delta_pos   # 3-dim xyz delta + gripper = 4-dim action
      num_frames: 1
